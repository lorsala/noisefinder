name: Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Poetry
        run: python -m pip install --upgrade poetry

      - name: Check Poetry
        run: python -m poetry --version

      - name: Install dependencies
        run: python -m poetry install --with test

      - name: Run tests
        run: python -m poetry run python -m pytest

      - name: Install notebook kernel
        run: python -m poetry run python -m ipykernel install --user --name noisefinder --display-name "noisefinder"

      - name: Test notebooks
        run: python -m poetry run python -m pytest --nbmake examples/